name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Locate preinstalled Android cmdline-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          CMDLINE_TOOLS_BIN=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -type d -name bin | sort -V | tail -n 1)
          test -n "$CMDLINE_TOOLS_BIN"
          echo "Using: $CMDLINE_TOOLS_BIN"
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK/NDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Switch to JDK 21 for libXray native build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build official XTLS libXray v26.9.9
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          rm -rf .native/libXray
          git clone --depth 1 --branch v26.9.9 https://github.com/XTLS/libXray.git .native/libXray
          export GOANDROIDAPI=21
          python3 .native/libXray/build/main.py android
          mkdir -p app/libs
          AAR="$(find .native/libXray -type f -name '*.aar' | head -n 1)"
          test -n "$AAR"
          cp "$AAR" app/libs/libXray.aar
          ls -lh app/libs/libXray.aar

      - name: Switch back to JDK 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privbrowse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
