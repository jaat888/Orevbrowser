name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Locate preinstalled Android cmdline-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          CMDLINE_TOOLS_BIN=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -type d -name bin | sort -V | tail -n 1)
          test -n "$CMDLINE_TOOLS_BIN"
          echo "Using: $CMDLINE_TOOLS_BIN"
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK/NDK
        # ndk;28.2.13676358 added: AGP 9.0.0's default ndkVersion (neither
        # :app nor :openvpn sets android.ndkVersion explicitly), so it's
        # what AGP will look for/auto-provision for :app now that root
        # build.gradle pins AGP 9.0.0. ics-openvpn's own separately-pinned
        # NDK (may differ) is still detected and installed in the next step.
        run: sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.2.12479018" "ndk;28.2.13676358"

      # settings.gradle declares project(":openvpn") pointing at
      # libs/ics-openvpn/main. Without this checkout that directory does not
      # exist, so Gradle treats :openvpn as an empty project with no
      # consumable configuration and ":app:assembleDebug" fails with
      # "Could not resolve project :openvpn ... None of the consumable
      # configurations have attributes." Pinned to v0.7.64 per
      # libs/ics-openvpn/README.txt (PrivBrowseVpnService.kt's ConfigParser/
      # VpnProfile/ProfileManager/VPNLaunchHelper/OpenVPNService calls were
      # checked against that exact tag).
      - name: Clone ics-openvpn (GPLv2 OpenVPN engine, pinned v0.7.64)
        run: |
          rm -rf libs/ics-openvpn
          git clone --recursive --branch v0.7.64 https://github.com/schwabe/ics-openvpn.git libs/ics-openvpn
          test -f libs/ics-openvpn/main/build.gradle || test -f libs/ics-openvpn/main/build.gradle.kts

      # ics-openvpn's main/build.gradle(.kts) sets its OWN `ndkVersion`
      # (independent of whatever NDK we install for libXray below). If that
      # exact side-by-side NDK isn't already present, AGP may fail to
      # auto-provision it in a locked-down CI sandbox, so install it
      # explicitly here instead of hoping it matches.
      - name: Install ics-openvpn's pinned NDK
        run: |
          NDK_VER=$(grep -hoE 'ndkVersion[^"'"'"']*["'"'"']([0-9]+\.[0-9]+\.[0-9]+)["'"'"']' \
            libs/ics-openvpn/main/build.gradle libs/ics-openvpn/main/build.gradle.kts 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -n "$NDK_VER" ]; then
            echo "ics-openvpn pins NDK $NDK_VER — installing it"
            sdkmanager "ndk;$NDK_VER"
          else
            echo "Could not detect ics-openvpn's pinned ndkVersion from source; relying on AGP auto-download during the build"
          fi

      - name: Install autotools for ics-openvpn native OpenSSL/openvpn build
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Switch to JDK 21 for libXray native build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build official XTLS libXray v26.9.9
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          rm -rf .native/libXray
          git clone --depth 1 --branch v26.9.9 https://github.com/XTLS/libXray.git .native/libXray
          export GOANDROIDAPI=21
          python3 .native/libXray/build/main.py android
          mkdir -p app/libs
          AAR="$(find .native/libXray -type f -name '*.aar' | head -n 1)"
          test -n "$AAR"
          cp "$AAR" app/libs/libXray.aar
          ls -lh app/libs/libXray.aar

      - name: Switch back to JDK 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          # Bumped from 8.5: root build.gradle pins AGP 9.0.0 (to match
          # libs/ics-openvpn's own version-catalog request for that same
          # plugin/version), and AGP 9.0.0 requires Gradle >= 9.1.0. This
          # step installs and runs its own `gradle` binary (not `./gradlew`),
          # so it must be bumped here too, separately from
          # gradle/wrapper/gradle-wrapper.properties.
          gradle-version: "9.2.0"
          # ics-openvpn (cloned above) ships its own gradle/wrapper/gradle-wrapper.jar
          # from its own Gradle version. setup-gradle validates every wrapper jar in
          # the repo by default and that one isn't in its trusted-checksum list, so
          # the whole step fails with "At least one Gradle Wrapper Jar failed
          # validation!" even though nothing is actually wrong with it. We don't use
          # ics-openvpn's own wrapper (we invoke gradle directly via gradle-version
          # above), so it's safe to skip this check.
          validate-wrappers: false

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privbrowse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
