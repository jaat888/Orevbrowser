name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Locate preinstalled Android cmdline-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          CMDLINE_TOOLS_BIN=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -type d -name bin | sort -V | tail -n 1)
          test -n "$CMDLINE_TOOLS_BIN"
          echo "Using: $CMDLINE_TOOLS_BIN"
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK/NDK
        run: sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.2.12479018"

      # settings.gradle declares project(":openvpn") pointing at
      # libs/ics-openvpn/main. Without this checkout that directory does not
      # exist, so Gradle treats :openvpn as an empty project with no
      # consumable configuration and ":app:assembleDebug" fails with
      # "Could not resolve project :openvpn ... None of the consumable
      # configurations have attributes." Pinned to v0.7.64 per
      # libs/ics-openvpn/README.txt (PrivBrowseVpnService.kt's ConfigParser/
      # VpnProfile/ProfileManager/VPNLaunchHelper/OpenVPNService calls were
      # checked against that exact tag).
      - name: Clone ics-openvpn (GPLv2 OpenVPN engine, pinned v0.7.64)
        run: |
          rm -rf libs/ics-openvpn
          git clone --recursive --branch v0.7.64 https://github.com/schwabe/ics-openvpn.git libs/ics-openvpn
          test -f libs/ics-openvpn/main/build.gradle || test -f libs/ics-openvpn/main/build.gradle.kts

      # ics-openvpn's own gradle/libs.versions.toml requests AGP at whatever
      # version its maintainers currently pin (seen: 9.0.0), which does not
      # match the AGP version our root build.gradle/settings.gradle pin
      # (8.2.2) and that ics-openvpn's own build.gradle.kts code actually
      # needs. settings.gradle's pluginManagement.resolutionStrategy already
      # forces BOTH requests to resolve to the same module (8.2.2), but
      # Gradle still separately compares the two REQUESTED version strings
      # and fails with "already on the classpath with a different version"
      # even when both resolve to the identical artifact. So we rewrite the
      # requested version in ics-openvpn's own catalog file in place, right
      # after cloning it and before Gradle ever reads it.
      - name: Patch ics-openvpn's AGP version to match ours
        run: python3 scripts/patch_ics_openvpn_agp_version.py

      # ics-openvpn's :main is a real, complete standalone VPN app —
      # its plugins{} block applies com.android.application, not
      # com.android.library. AGP does not support one application
      # module depending on another via `implementation project(...)`;
      # that mismatch is the actual cause of ":app:processDebugResources"
      # failing with "Cannot find PROCESSED_RES output for
      # SerializedForm(...)" — AGP's application-only resource/artifact
      # bookkeeping doesn't produce what a consumer needs from a
      # dependency. Converting :openvpn to a plain library (same
      # flavors/variant names Gradle was already resolving correctly)
      # is the officially-supported shape for this.
      - name: Convert ics-openvpn's :main module from application to library
        run: python3 scripts/patch_ics_openvpn_to_library.py

      # DEBUG: the java compile errors seen so far ("cannot find symbol"
      # for BaseActivity, MainActivity, VPNPreferences, InternalWebView,
      # Utils, ProfileEncryption, KeyChainSettingsFragment — i.e. large
      # swaths of ics-openvpn's OWN shared classes suddenly unresolved)
      # point at something structural in how the two patch scripts above
      # left this file — not a single missing symbol. Print the exact
      # post-patch file, with line numbers, so the real content (not a
      # guess/reconstruction) is visible directly in this log for the
      # next diagnosis pass. Safe to remove once the build is green.
      - name: 'DEBUG: print patched ics-openvpn build.gradle.kts'
        run: cat -n libs/ics-openvpn/main/build.gradle.kts

      # ics-openvpn's main/build.gradle(.kts) sets its OWN `ndkVersion`
      # (independent of whatever NDK we install for libXray below). If that
      # exact side-by-side NDK isn't already present, AGP may fail to
      # auto-provision it in a locked-down CI sandbox, so install it
      # explicitly here instead of hoping it matches.
      - name: Install ics-openvpn's pinned NDK
        run: |
          NDK_VER=$(grep -hoE 'ndkVersion[^"'"'"']*["'"'"']([0-9]+\.[0-9]+\.[0-9]+)["'"'"']' \
            libs/ics-openvpn/main/build.gradle libs/ics-openvpn/main/build.gradle.kts 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -n "$NDK_VER" ]; then
            echo "ics-openvpn pins NDK $NDK_VER — installing it"
            sdkmanager "ndk;$NDK_VER"
          else
            echo "Could not detect ics-openvpn's pinned ndkVersion from source; relying on AGP auto-download during the build"
          fi

      - name: Install autotools for ics-openvpn native OpenSSL/openvpn build
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Switch to JDK 21 for libXray native build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build official XTLS libXray v26.9.9
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          rm -rf .native/libXray
          git clone --depth 1 --branch v26.9.9 https://github.com/XTLS/libXray.git .native/libXray
          export GOANDROIDAPI=21
          python3 .native/libXray/build/main.py android
          mkdir -p app/libs
          AAR="$(find .native/libXray -type f -name '*.aar' | head -n 1)"
          test -n "$AAR"
          cp "$AAR" app/libs/libXray.aar
          ls -lh app/libs/libXray.aar

      - name: Switch back to JDK 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP is pinned to 8.2.2 (see root build.gradle + settings.gradle's
          # pluginManagement.resolutionStrategy override) — AGP 9.0.0 was
          # tried and reverted because libs/ics-openvpn's real build script
          # still uses pre-AGP9 variant APIs that AGP 9 removed outright.
          # Gradle 8.5 matches AGP 8.2.2's requirements. This step installs
          # its own `gradle` binary (not `./gradlew`), so it must stay in
          # sync with gradle/wrapper/gradle-wrapper.properties.
          gradle-version: "8.5"
          # ics-openvpn (cloned above) ships its own gradle/wrapper/gradle-wrapper.jar
          # from its own Gradle version. setup-gradle validates every wrapper jar in
          # the repo by default and that one isn't in its trusted-checksum list, so
          # the whole step fails with "At least one Gradle Wrapper Jar failed
          # validation!" even though nothing is actually wrong with it. We don't use
          # ics-openvpn's own wrapper (we invoke gradle directly via gradle-version
          # above), so it's safe to skip this check.
          validate-wrappers: false

      # NOTE: this must stay ":app:assembleDebug" and NOT bare "assembleDebug".
      # A bare task name makes Gradle run "assembleDebug" in EVERY subproject
      # that has one — including libs/ics-openvpn's own :openvpn library,
      # which then tries to build ALL of its own flavor combinations
      # (ui + skeleton, ovpn2 + ovpn23), not just the skeletonOvpn2 combo
      # :app actually depends on (see app/build.gradle's
      # missingDimensionStrategy calls). Building the "ui" flavor on its own
      # fails with cascading "cannot find symbol" errors (BaseActivity,
      # VpnProfile, Utils, MainActivity, ...) — that flavor is ics-openvpn's
      # own standalone UI, unused by this app, and broken by the
      # application->library patch above. Scoping the task to :app avoids
      # building it at all.
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privbrowse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
