plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.privbrowse.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.privbrowse.app"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.5.0-ultimate-wishlist"

        ndk {
            // Real phones are arm; x86/x86_64 only matter for emulators.
            // libXray's Go-built .so is large per-ABI, so dropping the two
            // emulator-only ABIs alone roughly halves the APK.
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        // ics-openvpn's :main module (aliased as :openvpn here) declares a
        // flavorDimension "implementation" with flavors "ui" (openvpn3=true,
        // needs SWIG to build the native ovpn3/SWIG JNI bridge) and
        // "skeleton" (openvpn3=false, classic engine only). :app has no such
        // dimension, so without telling Gradle which one to use,
        // ":app:assembleDebug" fails to pick a variant of ":openvpn"
        // ("Cannot choose between the following variants..."). We only ever
        // call the classic de.blinkt.openvpn.* API (ConfigParser, VpnProfile,
        // ProfileManager, VPNLaunchHelper, OpenVPNService) from
        // PrivBrowseVpnService.kt — never net.openvpn.ovpn3 — so "skeleton"
        // is correct, and it conveniently means SWIG is never needed.
        missingDimensionStrategy 'implementation', 'skeleton'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep the debug APK aligned with release ABI scope so CI test
            // builds aren't 2x bigger for no reason.
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation files('libs/libXray.aar')

    // Real OpenVPN engine, GPLv2 — required for VPN Gate connectivity.
    // See libs/ics-openvpn/README.txt and NOTICE.md before touching this.
    implementation project(':openvpn')
}
