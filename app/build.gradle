plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.privbrowse.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.privbrowse.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.3.0-mega-feature-pack"

        ndk {
            // Real phones are arm; x86/x86_64 only matter for emulators.
            // libXray's Go-built .so is large per-ABI, so dropping the two
            // emulator-only ABIs alone roughly halves the APK.
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep the debug APK aligned with release ABI scope so CI test
            // builds aren't 2x bigger for no reason.
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation files('libs/libXray.aar')
}
